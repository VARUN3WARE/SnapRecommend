version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: snapuser
      POSTGRES_PASSWORD: snappass
      POSTGRES_DB: snaprecommend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://snapuser:snappass@postgres:5432/snaprecommend
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
