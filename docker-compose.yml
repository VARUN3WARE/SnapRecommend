version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snaprecommend-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./api:/app/api
      - ./models:/app/models
      - ./retrieval:/app/retrieval
      - ./pipeline:/app/pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - PHASE_MODE=phase1
      - USE_RANKER=false
      - USER_ENCODER_MODE=legacy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snaprecommend-ui
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: streamlit run ui/app.py
    depends_on:
      api:
        condition: service_healthy

  # Optional: PostgreSQL for production use
  postgres:
    image: postgres:15-alpine
    container_name: snaprecommend-db
    environment:
      - POSTGRES_DB=snaprecommend
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
